<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Ezra | Front-End Developer</title>
     <style>
          :root {
               --bg: #030712;
               --card-bg: rgba(17, 24, 39, 0.7);
               --border: rgba(255, 255, 255, 0.08);
               --border-hover: rgba(56, 189, 248, 0.4);
               --text-main: #f9fafb;
               --text-muted: #9ca3af;
               --accent: #38bdf8;
               --accent-glow: rgba(56, 189, 248, 0.15);
          }

          * {
               box-sizing: border-box;
               margin: 0;
               padding: 0;
          }

          body {
               background-color: var(--bg);
               background-image:
                    radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
               color: var(--text-main);
               font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               min-height: 100vh;
               display: flex;
               flex-direction: column;
               justify-content: center;
               align-items: center;
               padding: 2rem;
               overflow-x: hidden;
          }

          .intro-card {
               max-width: 680px;
               width: 100%;
               background: var(--card-bg);
               backdrop-filter: blur(12px);
               -webkit-backdrop-filter: blur(12px);
               border: 1px solid var(--border);
               padding: 4rem 3rem;
               border-radius: 24px;
               text-align: center;
               box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
               position: relative;
          }

          .intro-card::before {
               content: '';
               position: absolute;
               top: -1px;
               left: -1px;
               right: -1px;
               bottom: -1px;
               border-radius: 24px;
               background: linear-gradient(135deg, var(--border), transparent, var(--border));
               z-index: -1;
          }

          .avatar-glow {
               position: relative;
               width: 120px;
               height: 120px;
               margin: 0 auto 2rem;
          }

          .avatar-glow::after {
               content: '';
               position: absolute;
               inset: 0;
               background: linear-gradient(135deg, var(--accent), #a855f7);
               border-radius: 50%;
               filter: blur(15px);
               opacity: 0.4;
               z-index: 1;
          }

          .avatar {
               position: relative;
               width: 100%;
               height: 100%;
               background: #111827;
               border: 2px solid var(--border);
               border-radius: 50%;
               display: flex;
               align-items: center;
               justify-content: center;
               font-size: 3rem;
               z-index: 2;
          }

          h1 {
               font-size: 3rem;
               font-weight: 800;
               letter-spacing: -0.05em;
               margin-bottom: 1rem;
               line-height: 1.1;
          }

          h1 span {
               background: linear-gradient(135deg, var(--accent), #a855f7);
               -webkit-background-clip: text;
               -webkit-text-fill-color: transparent;
          }

          p {
               color: var(--text-muted);
               font-size: 1.15rem;
               line-height: 1.7;
               margin-bottom: 2.5rem;
               font-weight: 400;
          }

          .cta-btn {
               display: inline-flex;
               align-items: center;
               gap: 0.75rem;
               background: var(--text-main);
               color: var(--bg);
               text-decoration: none;
               padding: 1rem 2.25rem;
               border-radius: 12px;
               font-weight: 600;
               font-size: 1.1rem;
               transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
               box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
          }

          .cta-btn:hover {
               background: var(--accent);
               color: var(--bg);
               transform: translateY(-3px);
               box-shadow: 0 10px 25px var(--accent-glow);
          }

          .cta-btn svg {
               transition: transform 0.3s;
          }

          .cta-btn:hover svg {
               transform: translateX(4px);
          }

          @media (max-width: 640px) {
               .intro-card {
                    padding: 3rem 1.5rem;
               }

               h1 {
                    font-size: 2.25rem;
               }

               p {
                    font-size: 1.05rem;
               }
          }
     </style>
</head>
<body>
     <main class="intro-card">
          <div class="avatar-glow">
               <div class="avatar">👨‍💻</div>
          </div>
          <h1>Hi, I'm <span>Ezra</span></h1>
          <p>
               I am a Front-End Developer dedicated to crafting pixel-perfect, responsive web interfaces. I specialize
               in translating complex layouts into clean, high-performance semantic code.
          </p>
          <a href="./projects.html" class="cta-btn">
               Explore My Projects
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
               </svg>
          </a>
     </main>
</body>

</html>
