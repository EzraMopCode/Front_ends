<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
     <link rel="stylesheet" href="style.css">
     <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
     <main class="container">
          <div class="bg-card">
               <div class="card">
                    <img src="./assets/images/illustration-article.svg" alt="the header top section image.">
                    <button class="text-tag">Learning</button>
                    <p class="date-publisher">Published 21 Dec 2023</p>
                    <h1>HTML & CSS foundations</h1>
                    <p class="desciption"> These languages are the backbone of every website, defining structure, content, and presentation.</p>
                    <div class="profile">
                          <img src="assets/images/image-avatar.webp" id="user-img" alt="the user image in circle."">
                          <p class="user-name">Greg Hooper</p>
                    </div>

               </div>
          </div>

     </main>

     <footer class="attribution">
          Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
          Coded by <a href="#">Ezra Mesele</a>.
     </footer>
</body>

</html>
